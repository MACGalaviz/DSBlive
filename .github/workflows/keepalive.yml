name: Supabase Keep-Alive

# Prevents the free-tier Supabase project from being paused due to inactivity.
# Runs every 3 days: pings the database AND commits a heartbeat file so GitHub
# does not disable this scheduled workflow after 60 days without repo activity.

on:
  schedule:
    - cron: '17 6 */3 * *' # every 3 days at 06:17 UTC
  workflow_dispatch: # allow manual runs

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf "$SUPABASE_URL/rest/v1/fields?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "Supabase ping OK"

      - name: Update heartbeat and reset GitHub 60-day timer
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive
          git commit -m ":recycle: chore(ci): keepalive heartbeat" || echo "no changes"
          git push
